name: build-android

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
      KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare web files
        run: |
          mkdir -p android-app/www
          cp index.html manifest.webmanifest sw.js icon-192.png icon-512.png android-app/www/

      - name: Create Android project
        working-directory: android-app
        run: |
          npm install
          npx cap add android
          cp -r res/* android/app/src/main/res/
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          npx cap sync android

      - name: Build release APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Sign APK
        working-directory: android-app
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > ks.p12
            PASS="$KS_PASS"
          else
            echo "No keystore secrets found: using a temporary key (updates will need uninstall first)"
            PASS=temporary123
            keytool -genkeypair -keystore ks.p12 -storetype PKCS12 -alias workdiary \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=Work Diary"
          fi
          "$BT/zipalign" -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks ks.p12 --ks-pass "pass:$PASS" --ks-key-alias workdiary --out WorkDiary.apk aligned.apk
          rm -f ks.p12

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android-app/WorkDiary.apk
